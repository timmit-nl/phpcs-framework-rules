name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # composer.lock is not committed, so this resolves the same way as the
      # GitLab job: composer update --prefer-dist.
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: PHPUnit
        run: composer test
